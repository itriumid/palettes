<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palette sample</title>
    <script>
      // ?palette=…&theme=light|dark, set on the root element the way an application does.
      const query = new URLSearchParams(location.search);
      const root = document.documentElement;
      const palette = query.get("palette");
      if (palette && palette !== "rhodonite") root.dataset.palette = palette;
      root.dataset.theme = query.get("theme") === "light" ? "light" : "dark";
    </script>
    <link rel="stylesheet" href="../dist/palettes.css" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 13px; }
      .muted { color: var(--muted); }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .surface, .elevated { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
      .surface { background: var(--surface); }
      .elevated { background: var(--elevated); }
      .accent { padding: 4px 10px; border-radius: 6px; background: var(--accent); color: var(--on-accent); }
      .tint {
        padding: 6px 8px; border-radius: 6px;
        background: var(--surface) linear-gradient(
          color-mix(in srgb, var(--accent) var(--tint-strength), transparent),
          color-mix(in srgb, var(--accent) var(--tint-strength), transparent));
      }
      .edge { padding: 4px 10px; border-radius: 6px; border: 2px solid var(--accent-edge); }
      .focus { padding: 4px 10px; border-radius: 6px; outline: 2px solid var(--focus); outline-offset: 2px; }
      input { accent-color: var(--accent-edge); margin: 0; }
    </style>
  </head>
  <body>
    <h1 id="name"></h1>
    <div class="row">
      <span class="surface">Text <span class="muted">muted</span></span>
      <span class="elevated">Elevated <span class="muted">muted</span></span>
    </div>
    <div class="row">
      <span class="accent">Accent</span>
      <span class="tint">Text on the tint</span>
    </div>
    <div class="row">
      <span class="edge">Accent line</span>
      <span class="focus">Focused</span>
      <label class="row" style="margin: 0"><input type="checkbox" checked /> Checked</label>
      <input type="range" value="60" style="width: 70px" />
    </div>
    <script>
      document.getElementById("name").textContent =
        `${query.get("label") ?? palette ?? "Rhodonite"}, ${root.dataset.theme}`;
    </script>
  </body>
</html>
