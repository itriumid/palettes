name: Check

# Every pull request and every push to main: type-check, build, and run the contrast check on
# every palette (`Test`, a required check), then screenshot the preview grid so a person can see
# what the numbers can't (`Preview`, an artifact on the run).
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Any `permissions:` block replaces the default token scopes, so grant per job.
permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      # Builds the package first, so what's checked is what would be published.
      - name: Check every palette's contrast
        run: pnpm test

      - name: Screenshot the preview
        run: |
          python3 -m http.server 8000 > /dev/null 2>&1 &
          sleep 1
          # Headless Chrome can stay open after writing the screenshot; the file is what counts.
          timeout 60 google-chrome --headless=new --disable-gpu --hide-scrollbars --no-sandbox \
            --window-size=964,700 --virtual-time-budget=3000 \
            --screenshot=preview/screenshot.png http://localhost:8000/preview/ || true
          test -s preview/screenshot.png

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview
          path: preview/screenshot.png
          if-no-files-found: error
