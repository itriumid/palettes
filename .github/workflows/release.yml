name: Release

# Pushing a `v*` tag publishes that version to npm, after the same checks every pull request
# runs. It uses npm's trusted publishing: no token is stored anywhere, npm trusts this workflow
# in this repository, and every version gets a provenance attestation linking it to the commit
# and the run that built it. See CONTRIBUTING.md, Releasing.
on:
  push:
    tags: ['v*']

# Any `permissions:` block replaces the default token scopes, so grant per job.
permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets the run prove to npm which repository and workflow it is.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag is a version and matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG isn't a release tag. Use vMAJOR.MINOR.PATCH, e.g. v0.2.0."
            exit 1
          fi
          version=$(jq -r .version package.json)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error file=package.json::version is $version, but the tag is $TAG"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      # No dependency cache for a release: what's published is built from a clean install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Check every palette's contrast
        run: pnpm test

      # A version that's already on npm is left alone, so the first version (published by hand,
      # see CONTRIBUTING.md) can still be tagged, and a release can be run again safely.
      - name: Check whether this version is published
        id: published
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm. Nothing to publish."
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Publish
        if: steps.published.outputs.already != 'true'
        run: |
          npm install --global npm@11
          npm publish --access public
